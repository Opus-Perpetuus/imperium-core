name: publish-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build --build-context kit=./vendor/kit \
            -t ghcr.io/opus-perpetuus/imperium-core:0.1.0 \
            -t ghcr.io/opus-perpetuus/imperium-core:latest \
            .
          docker push ghcr.io/opus-perpetuus/imperium-core:0.1.0
          docker push ghcr.io/opus-perpetuus/imperium-core:latest
